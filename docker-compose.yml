# Private deployment of Athena-sky.
#   docker compose up -d                       # HTTP on :8080
#   docker compose --profile tls up -d         # + Caddy reverse proxy with automatic HTTPS (set ATHENA_DOMAIN)
services:
  athena-sky:
    build: .
    image: athena-sky:latest
    restart: unless-stopped
    ports:
      # Behind the tls profile's Caddy, publish the app on this host only
      # (ATHENA_HTTP_PUBLISH=127.0.0.1:8080): clients then always go through the proxy.
      - "${ATHENA_HTTP_PUBLISH:-8080}:8080"
    environment:
      ATHENA_PUBLIC_URL: ${ATHENA_PUBLIC_URL:-http://localhost:8080}
      # 32-byte key (64 hex chars) used to encrypt webhook / integration secrets at rest.
      # If empty, a key is generated once and stored in the data volume.
      ATHENA_SECRET_KEY: ${ATHENA_SECRET_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Athena-sky <no-reply@example.com>}
      ATHENA_SIGNUP_CONFIRM_EMAIL: ${ATHENA_SIGNUP_CONFIRM_EMAIL:-}
      # 1: believe X-Forwarded-For from a proxy on this host or a private network (Caddy) –
      # or the proxies' addresses / CIDR ranges, comma-separated.
      ATHENA_TRUST_PROXY: ${ATHENA_TRUST_PROXY:-0}
      ATHENA_DEMO: ${ATHENA_DEMO:-0}
      ATHENA_IMAGERY_CACHE_MB: ${ATHENA_IMAGERY_CACHE_MB:-}
      ATHENA_TERRAIN_CACHE_MB: ${ATHENA_TERRAIN_CACHE_MB:-}
      ATHENA_TILE_FETCHES_PER_HOUR: ${ATHENA_TILE_FETCHES_PER_HOUR:-}
    volumes:
      - athena-data:/data

  caddy:
    profiles: ["tls"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [athena-sky]
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATHENA_DOMAIN: ${ATHENA_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  athena-data:
  caddy-data:
